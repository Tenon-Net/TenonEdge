# T0-11 测试 Broker 配置（验证用，不是部署模板）：Mosquitto 2.1.2，镜像 eclipse-mosquitto:2.1.2-alpine。
# 禁止匿名，用户名密码认证；同时开放明文 1883 与 TLS 8883。密码文件与证书由测试在容器启动时放入 /mosquitto/config。
# 部署用的持久化、积存上限、会话过期、在途窗口等检查项见总设计 §8.5，由 T2-07、T5 另行编写和实测。
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd

# 明文 MQTT
listener 1883

# TLS：服务器证书由测试 CA 签发
listener 8883
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
